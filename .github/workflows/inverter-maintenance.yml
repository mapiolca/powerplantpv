name: Inverter identities and maintenance reports

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/v1.8-inverter-maintenance]

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dolibarr: '20.0.0', php: '8.0', ref: '697bf01970740a3339cd99cf055b4428fc5e051c'}
          - {dolibarr: '21.0.0', php: '8.2', ref: 'fd970b582a4d8c5779a2958a4e9f4fce225cf085'}
          - {dolibarr: '22.0.0', php: '8.2', ref: '49b9a6d19f3deb6d410c0e9b3310e95be4ea7710'}
          - {dolibarr: '23.0.0', php: '8.4', ref: '57a1f05d490a7a80944a8232e9c613e6556d2704'}
          - {dolibarr: '24.0.0', php: '8.4', ref: '769c7db907099643558e77d7002c109cfda919e5'}
          # Inspected v25 development revision, not a claim about a final release.
          - {dolibarr: '25.0.0-alpha', php: '8.4', ref: '97f5408336b0544276e1c1c0a8bc2619e4afc5ee'}
    name: Reports / Dolibarr ${{ matrix.dolibarr }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: powerplantpv
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: ${{ matrix.ref }}
          path: dolibarr
          sparse-checkout: htdocs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli
          coverage: none
      - name: PHP syntax and isolated behavior
        run: |
          find powerplantpv/class -name '*report*.php' -print0 | xargs -0 -n1 php -l
          php -l powerplantpv/class/powerplantpvequipmentidentity.class.php
          php -l powerplantpv/powerplant_composition.php
          php -l powerplantpv/maintenance_intervention_report.php
          php -l powerplantpv/core/modules/modPowerPlantPV.class.php
          php -l powerplantpv/core/modules/fichinter/doc/pdf_powerplantpvreport.modules.php
          php -l powerplantpv/core/modules/fichinter/doc/powerplantpvreportpartspdf.trait.php
          php powerplantpv/test/inverter_maintenance.php
          php powerplantpv/test/report_plant_completion.php dolibarr/htdocs
      - name: Native contracts with simulated schema and PDF capture
        run: php powerplantpv/test/inverter_maintenance_native.php dolibarr/htdocs powerplantpv
      - name: Visual PDF rendered with the core TCPDF
        run: php powerplantpv/test/visual_report_pdf_native.php dolibarr/htdocs powerplantpv
      - name: Self-inspection PDF rendered by parts with the core TCPDF
        run: php powerplantpv/test/autocontrol_report_pdf_native.php dolibarr/htdocs powerplantpv
